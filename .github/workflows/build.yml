name: build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build package
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          make clean package FINALPACKAGE=1
          mkdir -p artifacts
          find .theos -name 'LiquidTabBar.dylib' -print -exec cp {} artifacts/ \;
          find packages -name '*.deb' -print -exec cp {} artifacts/ \;
          cp LiquidTabBar.plist artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiquidTabBar
          path: artifacts/*
          if-no-files-found: error
